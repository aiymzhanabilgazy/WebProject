<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>InspireMe</title>
     
     <link rel="stylesheet" href="/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">

    

    
</head>
<body>
    <header class="navbar">
    <div class="nav-left">
        <a href="/" class="nav-icon" title="Home">
            <ion-icon name="home-outline"></ion-icon>
        </a>

        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="logo">
        Inspire Me | Creativity & Locations
    </div>

    <div class="nav-right">
        <!-- LOGIN ICON -->
        <a href="/auth" id="loginBtn" class="nav-icon" title="Login">
            <i class="ph ph-fingerprint"></i>
        </a>

        <!-- LOGOUT ICON -->
        <button id="logoutBtn" class="nav-icon" title="Logout" style="display:none;">
             <i class="ph ph-sign-out"></i>
        </button>




        <!-- direct message -->
        <a href="/messages" class="nav-icon" title="Messages">
            <ion-icon name="paper-plane-outline"></ion-icon>
        </a>

        <!-- menu -->
        <div class="menu-dropdown">
            <button class="dropbtn icon-btn" title="Menu">
                <ion-icon name="menu-outline"></ion-icon>
            </button>

            <div class="dropdown-content">
                <a href="#">Likes</a>
                <a href="#">Saved</a>
                <a href="#">Comments</a>
            </div>
        </div>
    </div>
</header>

    <!--main-->
    <main>
        <section class="banner">
            <img src="/images/banner.jpg" alt="banner">
            <div class="banner-content">
                <div class="banner-sections">
                    <a href="/creativity" class="banner-card">
                        <h3>Creativity</h3>
                        <span>Projects • Ideas • Study</span>
                    </a>
                    <a href="/locations" class="banner-card">
                        <h3>Locations</h3>
                        <span>Cafes • Nature • Relax</span>
                    </a>
                </div>
            </div>
        </section>



        <!--pics-->
        <section class="pins" id="pinsContainer"></section>

        <!-- Замените секцию create-post-container и форму -->
        <div class="create-post-container">
            <button id="openCreatePost" class="create-post-btn">+ Create post</button>
        </div>

        <div id="createPostForm" style="display:none; margin:20px; background: white; padding: 20px; border-radius: 10px;">
            <input id="postAuthor" placeholder="Your name" />
            <input id="postImage" placeholder="Image URL (e.g. /images/pin1.jpg)" />
            <textarea id="postDescription" placeholder="Description"></textarea>
            <select id="postCategory">
                <option value="creativity">Creativity</option>
                <option value="locations">Locations</option>
            </select>
            <input type="hidden" id="postId" />
            <button id="submitPost">Publish</button>
            <button id="cancelEdit" style="display:none;">Cancel</button>
        </div>



        <!--show more button-->
        <div class="show-more-container">
            <button class="show-more">SHOW MORE</button>
        </div>
    </main>

    <!--footer-->
     <footer class="footer">
        <div class="footer-content">
            <p class="footer-title">Inspire Me ✧ Creativity & Locations</p>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/creativity">Creativity</a>
                <a href="/locations">Locations</a>
            </div>
            <p class="footer-credit">&copy;2025 InspireMe. Designed with ♡</p>
        </div>
    </footer>
<script>
/* =========================
   LOGIN / LOGOUT UI (simple)
========================== */
const loginBtn = document.getElementById('loginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const createBtn = document.getElementById('openCreatePost');

async function checkAuth() {
    try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
            // Пользователь залогинен
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-flex';
            if (createBtn) createBtn.style.display = 'inline-flex';
        } else {
            // Гость
            loginBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'none';
            if (createBtn) createBtn.style.display = 'none';
        }
    } catch (err) {
        console.error("Auth check failed", err);
    }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
    const res = await fetch('/auth/logout', { 
        method: 'POST', 
        credentials: 'same-origin' 
    });
    if (res.ok) {
        // После выхода лучше перезагрузить страницу, чтобы сбросить состояние приложения
        window.location.href = '/'; 
    }
});

checkAuth();

/* =========================
   LOAD POSTS (public)
========================== */
const container = document.getElementById('pinsContainer');

fetch('/api/posts')
  .then(res => res.json())
  .then(posts => {
    container.innerHTML = '';
    posts.forEach(post => {
      container.innerHTML += `
        <div class="pin">
          <img src="${post.imageUrl}" alt="post image">
          <div class="pin-info">
            <p class="author">${post.author}</p>
            <p class="story">${post.description}</p>
          </div>
        </div>
      `;
    });
  });

/* =========================
   CREATE POST (only if logged)
========================== */
const openBtn = document.getElementById('openCreatePost');
const form = document.getElementById('createPostForm');

if (openBtn && form) {
  openBtn.addEventListener('click', () => {
    if (openBtn.style.display === 'none') return;
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
}

const submitBtn = document.getElementById('submitPost');

if (submitBtn) {
  submitBtn.addEventListener('click', () => {
    const author = document.getElementById('postAuthor').value.trim();
    const description = document.getElementById('postDescription').value.trim();
    const imageUrl = document.getElementById('postImage').value.trim();
    const category = document.getElementById('postCategory').value;

    if (!author || !description || !imageUrl) {
      alert('Please fill all fields');
      return;
    }

    fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ author, description, imageUrl, category })
    }).then(res => {
      if (res.ok) location.reload();
      else alert('Failed to create post');
    });
  });
}
</script>



<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
