<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>InspireMe</title>
     
     <link rel="stylesheet" href="/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">

</head>
<body>
    <header class="navbar">
    <div class="nav-left">
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="logo">
        Inspire Me | Creativity & locations
    </div>

    <div class="nav-right">
        <a href="/" class="nav-icon" title="Home">
            <ion-icon name="home-outline"></ion-icon>
        </a>
        <!-- LOGIN ICON -->
        <a href="/auth" id="loginBtn" class="nav-icon" title="Login">
            <i class="ph ph-fingerprint"></i>
        </a>

        <!-- PERSON ICON -->
        <button id="userBtn" class="nav-icon user-icon" title="Profile" style="display:none;">
            <ion-icon name="person-outline"></ion-icon>
        </button>

        <!-- direct message -->
        <a href="/messages" class="nav-icon" title="Messages">
            <ion-icon name="paper-plane-outline"></ion-icon>
        </a>
    </div>
</header>

    <!--main-->
    <main>
        <section class="banner">
            <img src="/images/banner.jpg" alt="banner">

            <!-- SIMPLE GRAFFITI -->
             <div class="banner-graffiti">
                 <svg class="shape ribbon" viewBox="0 0 500 200">
                    <path d="
                    M0 120 C120 40, 260 220, 420 100 L420 140 C260 260, 120 100, 0 160 Z"/>
                </svg>
                 <svg class="shape ribbon small" viewBox="0 0 400 160">
                    <path d="
                    M0 80 C100 20, 220 160, 360 80 L360 110 C220 180, 100 80, 0 130 Z"/>
                </svg>
                <div class="circle big"></div>
                <div class="circle medium"></div>
                <div class="circle small"></div>
                <div class="circle x1"></div>
                <div class="circle x2"></div>
                <div class="circle x3"></div>
                <div class="circle x4"></div>
                <div class="circle big b1"></div>
                <div class="circle big b2"></div>
                <div class="circle big b3"></div>
            </div>

            <div class="banner-content">
                <div class="banner-sections">
                    <a href="/creativity" class="banner-card">
                        <h3>Creativity</h3>
                        <span>Projects • Ideas • Study</span>
                    </a>
                    <a href="/locations" class="banner-card">
                        <h3>Locations</h3>
                        <span>Cafes • Nature • Relax</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="pins" id="pinsContainer"></section>
        
        <div class="create-post-container">
            <button id="openCreatePost" class="create-post-btn">+ Create post</button>
        </div>
        
        <div id="createOverlay" class="create-overlay">
            <div class="create-modal">
                <button id="closeCreate" class="close-btn">✕</button>
                <h2>Create post</h2>
                <input id="postAuthor" placeholder="Your name" />
                <input id="postImage" placeholder="Image URL" />
                <textarea id="postDescription" placeholder="Description"></textarea>
                <select id="postCategory">
                    <option value="creativity">Creativity</option>
                    <option value="locations">Locations</option>
                </select>
                <button id="submitPost" class="publish-btn">Publish</button>
            </div>
        </div>

        <!--show more button-->
        <div class="show-more-container">
            <button class="show-more">SHOW MORE</button>
        </div>
    </main>

    <div id="userPanel" class="user-panel">
        <div class="user-panel-content">

            <div class="panel-header">
            <button id="closePanel" class="close-panel-btn">
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </button>
            </div>

            <h3 class="panel-title">Profile</h3>
                <a href="/likes" class="panel-link">
                <ion-icon name="heart-outline"></ion-icon>
                <span>Likes</span>
                </a>

                <a href="/saved" class="panel-link">
                <ion-icon name="bookmark-outline"></ion-icon>
                <span>Saved</span>
                </a>

                <a href="/privacy" class="panel-link">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <span>Privacy</span>
                </a>




            <div class="panel-footer">
            <button id="logoutBtn" class="logout-btn">
                🚪 Log out
            </button>
            </div>

        </div>
    </div>



    <!--footer-->
     <footer class="footer">
        <div class="footer-content">
            <p class="footer-title">Inspire Me ✧ Creativity & Locations</p>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/creativity">Creativity</a>
                <a href="/locations">Locations</a>
            </div>
            <p class="footer-credit">&copy;2025 InspireMe. Designed with ♡</p>
        </div>
    </footer>
<script>
/* =========================
   LOGIN / LOGOUT UI (simple)
========================== */
const loginBtn = document.getElementById('loginBtn');
const userBtn = document.getElementById('userBtn');
const createBtn = document.getElementById('openCreatePost');

async function checkAuth() {
    try {
        const res = await fetch('/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
            // Пользователь залогинен
            loginBtn.style.display = 'none';
            userBtn.style.display = 'inline-flex';
            if (createBtn) createBtn.style.display = 'inline-flex';
        } else {
            // Гость
            loginBtn.style.display = 'inline-flex';
            userBtn.style.display = 'none';
            if (createBtn) createBtn.style.display = 'none';
        }
    } catch (err) {
        console.error("Auth check failed", err);
    }
    
}
const userPanel = document.getElementById('userPanel');
const logoutBtn = document.getElementById('logoutBtn');

// открыть / закрыть панель
userBtn.addEventListener('click', () => {
  userPanel.classList.toggle('open');
});

// клик вне панели — закрыть
document.addEventListener('click', (e) => {
  if (
    userPanel.classList.contains('open') &&
    !userPanel.contains(e.target) &&
    !userBtn.contains(e.target)
  ) {
    userPanel.classList.remove('open');
  }
});

// logout
logoutBtn.addEventListener('click', async () => {
  const res = await fetch('/auth/logout', {
    method: 'POST',
    credentials: 'same-origin'
  });

  if (res.ok) {
    window.location.href = '/';
  }
});
const closePanelBtn = document.getElementById('closePanel');

closePanelBtn.addEventListener('click', () => {
  userPanel.classList.remove('open');
});



checkAuth();

/* =========================
   LOAD POSTS (public)
========================== */
const container = document.getElementById('pinsContainer');

</script>



<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script src="/js/renderPin.js"></script>
<script src="/js/home.js"></script>
<script src="/js/createPost.js"></script>


</body>
</html>
