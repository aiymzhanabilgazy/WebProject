<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creativity | InspireMe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/locations.css">

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<!-- HEADER -->
<header class="navbar">
    <div class="nav-left">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="logo">Inspire Me | Creativity & Locations</div>

    <div class="nav-right">
        <div class="menu-dropdown">
            <button class="dropbtn">Menu</button>
            <div class="dropdown-content">
                <a href="/creativity">Creativity</a>
                <a href="/locations">Locations</a>
            </div>
        </div>
    </div>
</header>

<main>

<section class="locations-header">
    <h1>Creativity Space 🎨</h1>
    <p>Share ideas, projects and inspiration</p>
</section>

<div class="create-post-container">
    <button id="openCreatePost" class="create-post-btn">+ Add creative post</button>
</div>

<div id="createPostForm" style="display:none; margin:20px; background:white; padding:20px; border-radius:10px;">
    <input id="postAuthor" placeholder="Your name" />
    <input id="postImage" placeholder="Image URL" />
    <textarea id="postDescription" placeholder="Description"></textarea>
    <input type="hidden" id="postId" />
    <select id="postCategory">
        <option value="creativity">🎨 Creativity</option>
        <option value="locations">📍 Location</option>
    </select>

    <button id="submitPost">Publish</button>
</div>

<section class="pins locations-pins" id="pinsContainer"></section>

</main>

<footer class="footer">
    <div class="footer-content">
        <p class="footer-title">Inspire Me ✧ Creativity & Locations</p>
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/creativity">Creativity</a>
            <a href="/locations">Locations</a>
        </div>
        <p class="footer-credit">Assignment 1 — Week 1</p>
    </div>
</footer>

<script>
const container = document.getElementById('pinsContainer');
const userId = localStorage.getItem('userId') || 'demo-user';

async function loadPosts() {
    const res = await fetch('/api/posts?category=creativity');
    const posts = await res.json();
    renderPosts(posts);
}

function renderPosts(posts) {
    container.innerHTML = posts.map(post => `
        <div class="pin location-pin">
            <img src="${post.imageUrl}">
            <div class="pin-info">
                <p class="author">${post.author}</p>
                <p class="story">${post.description}</p>
                <p class="location">🎨 Creativity</p>

                <div class="pin-actions">
                    <ion-icon name="heart-outline"></ion-icon>
                    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                </div>
            </div>
        </div>
    `).join('');
}

document.getElementById('openCreatePost').onclick = () => {
    document.getElementById('createPostForm').style.display = 'block';
};

document.getElementById('submitPost').addEventListener('click', async () => {

  const category = document.getElementById('postCategory').value;

  const postData = {
    author: document.getElementById('postAuthor').value,
    imageUrl: document.getElementById('postImage').value,
    description: document.getElementById('postDescription').value,
    category: category,
    userId
  };

  try {
    await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(postData)
    });

    document.getElementById('createPostForm').style.display = 'none';
    loadPosts();

  } catch (error) {
    alert('Error creating post');
  }
});

loadPosts();
</script>

</body>
</html>
