<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creativity | InspireMe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/creativity.css">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <a href="/">Home</a>
    <a href="/creativity">Creativity</a>
    <a href="/locations">Locations</a>
  </div>
  <div class="logo">Inspire Me</div>
</header>

<main>

<section class="page-header">
  <h1>🎨 Locations</h1>
  <p>Cafes,nature and just Relax</p>
</section>

<!-- CREATE -->
<div class="create-post-container">
  <button id="openCreatePost" class="create-post-btn">+ Add location</button>
</div>

<!-- OVERLAY -->
<div id="createOverlay" class="create-overlay">
  <div class="create-modal">
    <button id="closeCreate" class="close-btn">✕</button>

    <h2>Add location</h2>

    <input id="postAuthor" placeholder="Place name" />
    <input id="postImage" placeholder="Image URL" />
    <textarea id="postDescription" placeholder="Description"></textarea>

    <!-- ВАЖНО: категория фиксирована -->
    <input type="hidden" id="postCategory" value="locations">

    <button id="submitPost" class="publish-btn">Publish</button>
  </div>
</div>


<!-- PINS -->
<section class="pins" id="pinsContainer"></section>

</main>

<script src="/js/renderPin.js"></script>
<script src="/js/locations.js"></script>
<script src="/js/createPost.js"></script>

</body>
</html>
